name: windows exe

# Masaüstü paketi Windows runner'da derleniyor ve tek dosyalık .exe
# bir GitHub Release'e yükleniyor. Localde makensis yoksa bu adım yok;
# burada hem makensis hem Windows olduğu için çıktı dist/KickForge.exe.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paketle:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # electron zip'ini build.js kendisi indiriyor; npm ikinci kez indirmesin
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # windows runner'da nsis zaten kurulu geliyor; choco'ya gerek yok.
      # yoksa da kurmayı deniyor ama asıl yol makensis'i bulup sürümünü basmak.
      - name: nsis
        shell: pwsh
        run: |
          $adaylar = @(
            (Get-Command makensis -ErrorAction SilentlyContinue).Source,
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { $_ -and (Test-Path $_) }

          if (@($adaylar).Count -eq 0) {
            "makensis yok, choco deneniyor" | Add-Content $env:GITHUB_STEP_SUMMARY
            choco install nsis -y --no-progress *>&1 | Tee-Object -FilePath nsis.log
            Get-Content nsis.log -Tail 30 | Add-Content $env:GITHUB_STEP_SUMMARY
            $adaylar = @('C:\Program Files (x86)\NSIS\makensis.exe') | Where-Object { Test-Path $_ }
          }

          if (@($adaylar).Count -eq 0) { throw 'makensis bulunamadı' }
          $makensis = @($adaylar)[0]
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis çalışmadı ($LASTEXITCODE): $makensis" }
          "makensis: $makensis" | Add-Content $env:GITHUB_STEP_SUMMARY
          "makensis: $makensis"

      - name: bagimliliklar
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci düştü ($LASTEXITCODE)" }

      - name: paketle
        shell: pwsh
        working-directory: desktop
        run: |
          node build.js *>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if (Test-Path build.log) {
            Get-Content build.log -Tail 40 | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($code -ne 0) {
            "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            $hatalar = Get-Content build.log -ErrorAction SilentlyContinue |
              Where-Object { $_ -match 'HATA|rror|bort|nvalid|no files' } |
              Select-Object -Last 3
            foreach ($s in $hatalar) { "::error::" + ($s -replace '%','%25') }
            throw "build.js düştü ($code)"
          }

      - name: tek dosya çıktı var mı
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/dist/KickForge.exe)) { throw 'dist/KickForge.exe üretilmedi' }
          Get-Item desktop/dist/KickForge.exe | Format-List Name, Length, LastWriteTime

      - name: release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-r$env:GITHUB_RUN_NUMBER"
          $notes = @(
            "masaüstü (.exe) · GitHub Actions windows runner'ında derlendi",
            "",
            "indir, çift tıkla: ilk açılışta `$LOCALAPPDATA\KickForge'e kuruyor,",
            "sonraki açılışlarda doğrudan çalışıyor, yeni sürüm indiğinde kendini",
            "güncelliyor. Kaynak: desktop/installer.nsi + desktop/build.js",
            "",
            "sayfa: https://kickforge-mor-tilki.vercel.app/"
          ) -join "`n"
          gh release create $tag "desktop/dist/KickForge.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "KickForge masaüstü (.exe) · r$env:GITHUB_RUN_NUMBER" `
            --notes $notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "release oluşturulamadı ($LASTEXITCODE)" }
