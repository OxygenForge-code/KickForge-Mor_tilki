name: windows exe

# Masaüstü uygulaması artık electron değil: C# / .NET 8 / WPF.
# windows-latest runner'da tek dosya (self-contained) olarak derlenip
# GitHub Release'e yükleniyor. Visual Studio gerekmiyor.

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # IncludeAllContentForSelfExtract şart: onsuz sıkıştırılmış tek dosya
      # paketinde wpf'in ekrana çizim yolu bozuluyor ve pencere kapkara açılıyor
      # (içeriden RenderTargetBitmap doğru çiziyordu, o yüzden uzun süre
      # görünmedi). Bu ayarla exe 66 mb kalıyor ve ekrana normal çiziliyor.
      - name: derle
        shell: pwsh
        run: |
          dotnet publish windows/KickForgeDesktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish düştü ($LASTEXITCODE)" }

      - name: çıktıyı doğrula
        shell: pwsh
        run: |
          if (-not (Test-Path out/KickForge.exe)) { throw 'out/KickForge.exe üretilmedi' }
          $exe = Get-Item out/KickForge.exe
          "boyut: {0:N0} bayt" -f $exe.Length | Add-Content $env:GITHUB_STEP_SUMMARY
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'çıktı bir Windows exe değil' }
          Get-Item out/KickForge.exe | Format-List Name, Length, LastWriteTime

      - name: release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-r$env:GITHUB_RUN_NUMBER"
          $notes = @(
            "native windows uygulaması · C# / .NET 8 / WPF",
            "",
            "elektron yok, gömülü tarayıcı yok: pencereyi windows'un kendi",
            "çizim katmanı çiziyor. tek dosya, kurulum gerektirmez:",
            "indir, çift tıkla, çalışır (kendi .NET çalışma zamanını taşır).",
            "",
            "ayarlar ve geçmiş: %APPDATA%\KickForge\native",
            "",
            "kaynak: windows/ · site: https://kickforge-mor-tilki.vercel.app/"
          ) -join "`n"
          gh release create $tag "out/KickForge.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "KickForge masaüstü · r$env:GITHUB_RUN_NUMBER" `
            --notes $notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "release oluşturulamadı ($LASTEXITCODE)" }
